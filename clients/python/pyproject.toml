[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-audmap"
version = "1.0.0"
description = "Standalone authenticated AUDMAP client for ATHENA interop"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["pyzmq>=25", "msgpack>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

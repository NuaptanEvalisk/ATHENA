<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{CANONICAL}}{{DESCRIPTION_META}}
<link rel="icon" href="icons/favicon.png">
</head><body>
<script>
(function(){
  var path={{ENTRY}};
  if(!path||path==='about:blank') return;
  var hash='';
  var split=path.indexOf('#');
  if(split>=0){hash=path.substring(split);path=path.substring(0,split);}
  var encoded=String(path).split('/').map(function(part){
    try{return encodeURIComponent(decodeURIComponent(part));}
    catch(e){return encodeURIComponent(part);}
  }).join('/');
  if(/^https?:$/i.test(location.protocol)&&/\.html$/i.test(encoded))
    encoded=encoded.substring(0,encoded.length-5);
  location.replace(encoded+hash);
})();
</script>
</body></html>

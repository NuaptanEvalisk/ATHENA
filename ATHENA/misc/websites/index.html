<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{CANONICAL}}{{DESCRIPTION_META}}
<link rel="icon" href="css/favicon.png">
<link rel="stylesheet" href="css/site.{{ASSET_VERSION}}.css">
<link rel="stylesheet" href="css/theme.{{ASSET_VERSION}}.css">
<script src="js/site-data.{{ASSET_VERSION}}.js"></script>
<script src="js/window-manager.{{ASSET_VERSION}}.js"></script>
<script src="js/explorers.{{ASSET_VERSION}}.js"></script>
<script src="js/outline.{{ASSET_VERSION}}.js"></script>
<script src="js/search.{{ASSET_VERSION}}.js"></script>
<script src="js/quick-switcher.{{ASSET_VERSION}}.js"></script>
<script src="js/app.{{ASSET_VERSION}}.js"></script>
</head><body>
<div id="desktop" class="desktop" role="main" aria-label="ATHENA website desktop" tabindex="-1">
<div id="vault" class="win" role="region" aria-labelledby="vault-title" style="left:16px;top:16px;width:320px;height:380px"><div class="title" tabindex="0"><span id="vault-title" class="caption">Vault Explorer</span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Vault Explorer"></button><button type="button" class="ctrl max" aria-label="Maximize Vault Explorer"></button><button type="button" class="ctrl restore" aria-label="Restore Vault Explorer"></button><button type="button" class="ctrl close" aria-label="Close Vault Explorer"></button></span></div><div id="vault-content" class="content"></div><div class="resize" aria-hidden="true"></div></div>
<div id="namespaces" class="win" role="region" aria-labelledby="namespaces-title" style="left:360px;top:16px;width:320px;height:300px"><div class="title" tabindex="0"><span id="namespaces-title" class="caption">Namespace Explorer</span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Namespace Explorer"></button><button type="button" class="ctrl max" aria-label="Maximize Namespace Explorer"></button><button type="button" class="ctrl restore" aria-label="Restore Namespace Explorer"></button><button type="button" class="ctrl close" aria-label="Close Namespace Explorer"></button></span></div><div id="namespace-content" class="content"></div><div class="resize" aria-hidden="true"></div></div>
<div id="outline" class="win" role="region" aria-labelledby="outline-title" style="left:360px;top:340px;width:320px;height:300px"><div class="title" tabindex="0"><span id="outline-title" class="caption">Outline</span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Outline"></button><button type="button" class="ctrl max" aria-label="Maximize Outline"></button><button type="button" class="ctrl restore" aria-label="Restore Outline"></button><button type="button" class="ctrl close" aria-label="Close Outline"></button></span></div><div id="outline-content" class="content"></div><div class="resize" aria-hidden="true"></div></div>
<div id="global-search" class="win" role="region" aria-labelledby="global-search-title" style="left:704px;top:16px;width:420px;height:300px"><div class="title" tabindex="0"><span id="global-search-title" class="caption">Global Search</span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Global Search"></button><button type="button" class="ctrl max" aria-label="Maximize Global Search"></button><button type="button" class="ctrl restore" aria-label="Restore Global Search"></button><button type="button" class="ctrl close" aria-label="Close Global Search"></button></span></div><div class="content"><div class="pane-tools"><label class="sr-only" for="global-search-input">Search exported documents</label><input id="global-search-input" placeholder="Search exported documents" autocomplete="off"></div><div id="global-search-results" aria-live="polite"></div></div><div class="resize" aria-hidden="true"></div></div>
<div id="quick-switcher" class="win" role="region" aria-labelledby="quick-switcher-title" style="left:1148px;top:16px;width:360px;height:300px"><div class="title" tabindex="0"><span id="quick-switcher-title" class="caption">Quick Switcher</span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Quick Switcher"></button><button type="button" class="ctrl max" aria-label="Maximize Quick Switcher"></button><button type="button" class="ctrl restore" aria-label="Restore Quick Switcher"></button><button type="button" class="ctrl close" aria-label="Close Quick Switcher"></button></span></div><div class="content"><div class="pane-tools"><label class="sr-only" for="quick-switcher-input">Jump to file or namespace</label><input id="quick-switcher-input" placeholder="Jump to file or namespace" autocomplete="off"></div><div id="quick-switcher-results" aria-live="polite"></div></div><div class="resize" aria-hidden="true"></div></div>
<div id="viewer" class="win" role="region" aria-labelledby="viewer-title" style="left:40px;top:340px;width:calc(100% - 80px);height:calc(100% - 370px)"><div class="title" tabindex="0"><span class="title-left"><span id="viewer-title" class="caption">Document</span><span class="doc-nav"><button type="button" id="doc-back" class="ctrl back" aria-label="Back"></button><button type="button" id="doc-forward" class="ctrl forward" aria-label="Forward"></button><button type="button" id="doc-standalone" class="ctrl standalone" aria-label="Open document in standalone tab"></button></span></span><span class="buttons"><button type="button" class="ctrl min" aria-label="Minimize Document"></button><button type="button" class="ctrl max" aria-label="Maximize Document"></button><button type="button" class="ctrl restore" aria-label="Restore Document"></button><button type="button" class="ctrl close" aria-label="Close Document"></button></span></div><div class="content"><iframe id="docframe" title="ATHENA document"></iframe></div><div class="resize" aria-hidden="true"></div></div>
<div id="missing-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="missing-title" aria-describedby="missing-text" hidden><strong id="missing-title">ATHENA</strong><p id="missing-text"></p><button type="button" onclick="closeMissing()">OK</button></div>
</div>
<div id="taskbar" class="taskbar" role="toolbar" aria-label="Open windows">
<button type="button" id="start-button" class="start-button" aria-haspopup="menu" aria-expanded="false" aria-controls="start-menu">Start</button>
<div id="start-menu" class="start-menu popup-menu" role="menu" aria-label="Start" hidden></div>
<div id="task-buttons" class="task-buttons"></div>
</div>
<div id="context-menu" class="context-menu popup-menu" role="menu" aria-label="Context menu" hidden></div>
</body></html>
